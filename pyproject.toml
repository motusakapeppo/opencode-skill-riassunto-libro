[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "riassunto-libro"
version = "2.1.0"
description = "Book-to-essay pipeline for university study"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyMuPDF>=1.23",
    "pdfplumber>=0.10",
    "pypdf>=4.0",
    "pytesseract>=0.3",
    "Pillow>=10.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "playwright>=1.40",
    "python-docx>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
